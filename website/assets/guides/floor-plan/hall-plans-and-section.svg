<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title description">
  <title id="title">Two-storey hall: illustrative plans and section</title>
  <desc id="description">Two 10 metre by 8 metre plan footprints show empty halls, east windows and a straight stair. The ground plan has a 1.2 metre entry; the upper plan marks a 3.5 by 1.4 metre slab opening around the 1.2 metre clear flight. A simplified section shows finished floors at zero and three metres, 2.8 metre clear heights and a 0.2 metre upper slab. The stair has fifteen 0.2 metre risers. This is an explanatory diagram based on the multi-storey engineering example, not a complete generated drawing or verified model output.</desc>
