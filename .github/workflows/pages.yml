name: Documentation site

on:
  pull_request:
    paths:
      - 'website/**'
      - 'wiki/**'
      - 'logo.png'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'wiki/**'
      - 'logo.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix website
      - name: Verify root/project output and detailed wiki links
        run: |
          npm --prefix website test
          npm --prefix website run wiki:check
      - name: Build the public site only
        run: npm --prefix website run build
        env:
          SITE_BASE_PATH: ${{ vars.HEPHAERA_SITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
      - name: Verify final deployment links
        run: npm --prefix website run check
        env:
          SITE_BASE_PATH: ${{ vars.HEPHAERA_SITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
      - name: Upload only generated public output
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read configured Pages metadata
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish the reviewed main build
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
