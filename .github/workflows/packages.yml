name: Installer packages
on:
  pull_request:
    paths: ['installer/**', 'commands/**', 'tests/test-installer*', '.github/workflows/*packages.yml', 'AGENTS.md', '.gitattributes', '.gitmodules', 'runtime/bubo', 'runtime/bubo.lock.json', 'LICENSE']
  push:
    branches: [main]
    paths: ['installer/**', 'commands/**', 'tests/test-installer*', '.github/workflows/*packages.yml', '.gitattributes', '.gitmodules', 'runtime/bubo', 'runtime/bubo.lock.json', 'LICENSE']
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.15.0'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.400'
      - run: node tests/test-installer-release.cjs
      - run: node tests/test-installer-publication.cjs
      - run: node tests/test-installer-release-runner.cjs
      - run: node tests/test-installer-packages-reproducible.cjs
      - run: node installer/scripts/pack.cjs --output .local/installer-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-packages
          path: |
            .local/installer-packages/artifacts/*
            .local/installer-packages/package-build.json
          include-hidden-files: true
          retention-days: 14
  consumers:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.15.0'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.400'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: installer-packages
          path: .local/installer-packages
      - run: node tests/test-installer-core.cjs
      - run: node tests/test-installer-maintenance.cjs
      - run: node tests/test-installer-packages.cjs --artifacts .local/installer-packages
